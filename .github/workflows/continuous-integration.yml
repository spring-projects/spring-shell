name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/4.0.4
    paths-ignore:
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu22-2-8

    name: CI Build for release/4.0.4
    if: ${{ !contains(github.event.head_commit.message, 'Release 4.0.4') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'release/4.0.4'

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
        run: ./mvnw -s settings.xml -DaltDeploymentRepository=local::file:deployment-repository --no-transfer-progress --batch-mode --update-snapshots deploy

      - name: Deploy to Artifactory
        if: ${{ github.repository == 'spring-projects/spring-shell-commercial' && github.ref_name == 'release/4.0.4' }}
        uses: spring-io/artifactory-deploy-action@c9ab821b2d7fb778b7e29f9cd6e9007e54a1eb4c # v0.0.7
        with:
          uri: 'https://usw1.packages.broadcom.com'
          username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
          build-name: 'spring-shell-4.0.4'
          project: 'spring'
          repository: 'spring-enterprise-maven-dev-local'
          folder: 'deployment-repository'
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
